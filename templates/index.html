<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Resume Classifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 0;
            color: #2d3748;
        }
        .container {
            max-width: 720px;
            margin: 40px auto;
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
            color: #2b6cb0;
        }
        label {
            font-weight: 600;
            display: block;
            margin-top: 20px;
            margin-bottom: 6px;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        .submit-btn {
            background-color: #2b6cb0;
            color: white;
            padding: 12px 20px;
            margin-top: 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .submit-btn:hover {
            background-color: #2c5282;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Smart Resume Classifier</h1>
    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form action="/result" method="post">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email Address</label>
        <input type="text" id="email" name="email" required>

        <label for="experience">Years of Experience</label>
        <select id="experience" name="experience">
            <option value="0-1">0-1 years</option>
            <option value="1-3">1-3 years</option>
            <option value="3-5">3-5 years</option>
            <option value=">5">5+ years</option>
        </select>

        <label for="skills">Key Skills (comma-separated)</label>
        <input type="text" id="skills" name="skills" placeholder="e.g. Python, Machine Learning, SQL">

        <label for="resume">Resume Content</label>
        <textarea id="resume" name="resume" placeholder="Paste your resume text here..." required></textarea>

        <input type="submit" class="submit-btn" value="Classify Resume & Recommend Jobs">
    </form>
    <div class="footer">&copy; 2025 ResumeAI Matcher</div>
</div>
</body>
</html>
