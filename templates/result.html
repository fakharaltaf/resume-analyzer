<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classification Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
            margin: 0;
            padding: 0;
            color: #2d3748;
        }
        .container {
            max-width: 720px;
            margin: 40px auto;
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        h1 {
            margin-bottom: 20px;
            text-align: center;
            color: #2b6cb0;
        }
        .summary {
            margin-bottom: 30px;
            background-color: #ebf8ff;
            border-left: 5px solid #2b6cb0;
            padding: 15px 20px;
            border-radius: 8px;
        }
        .summary p {
            margin: 8px 0;
            font-size: 1rem;
        }
        .job-listing {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: #f1f5f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .job-title {
            font-weight: bold;
            color: #2c5282;
            font-size: 1.1rem;
        }
        .job-desc {
            margin-top: 8px;
            font-size: 0.95rem;
            color: #4a5568;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #2b6cb0;
            text-decoration: none;
            font-weight: 600;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Results & Recommendations</h1>
    
    <div class="summary">
        <p><strong>Name:</strong> {{ name }}</p>
        <p><strong>Email:</strong> {{ email }}</p>
        <p><strong>Experience:</strong> {{ experience }}</p>
        <p><strong>Skills:</strong> {{ skills }}</p>
    </div>

    <h2>Top Job Matches</h2>
    {% for job in jobs %}
        <div class="job-listing">
            <div class="job-title">{{ job.title }}</div>
            <div class="job-desc">{{ job.cleaned_description[:350] }}...</div>
        </div>
    {% endfor %}

    <a href="/" class="back-link">&larr; Back to Home</a>
    <div class="footer">&copy; 2025 ResumeAI Matcher</div>
</div>
</body>
</html>
